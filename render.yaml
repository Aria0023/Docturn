# Render Blueprint — one public URL for DocTurn, backed by a PERSISTENT database.
# In Render: New → Blueprint → pick this repo/branch. It provisions a managed
# Postgres and a web service wired to it, so accounts, messages and attachments
# survive restarts and redeploys (a real multi-person test, not a throwaway demo).
# The app applies its own schema on first boot and self-seeds the demo org, so
# there is nothing to run by hand.
#
# Demo logins (org code ISPN, password "docturn"): chen / er.doc / director /
# er.director ; developer is user "dev" on org code DOCTURN (the app picks the
# right org automatically when you choose a role on the sign-in screen).
# Real testers can also self-register their own accounts from the sign-in screen.
databases:
  - name: docturn-db
    plan: free
    databaseName: docturn
    user: docturn

services:
  - type: web
    name: docturn-demo
    runtime: node
    plan: free
    branch: claude/sleepy-davinci-kmin7n
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Loosen the auth rate limiter for a shared test (role switching logs in).
      - key: RATE_LIMIT
        value: "off"
      # Persistent Postgres — the app creates its schema + seeds on first boot.
      # Data now survives restarts/redeploys (unlike the old in-process PGlite).
      - key: DATABASE_URL
        fromDatabase:
          name: docturn-db
          property: connectionString
